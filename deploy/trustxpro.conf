# TrustX Pro — Nginx site
# Update on server: /etc/nginx/sites-available/main
#
# PHP socket: unix:/run/php/php8.5-fpm.sock
# Check with: ls /run/php

server {
    listen 80;
    listen [::]:80;
    server_name trustxpro.in www.trustxpro.in;

    root /var/www/main;
    index index.php;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Browser pe .php dikhe to clean URL pe bhejo
    # $request_uri original rehta hai, isliye /privacy rewrite ke baad loop nahi hota
    if ($request_uri ~* "^/(.+)\.php(\?|$)") {
        return 301 /$1;
    }

    location ^~ /includes/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    location = /index.html  { return 301 /; }
    location = /terms.html  { return 301 /terms; }
    location = /privacy.html { return 301 /privacy; }

    location = /terms    { rewrite ^ /terms.php last; }
    location = /terms/   { rewrite ^ /terms.php last; }
    location = /privacy  { rewrite ^ /privacy.php last; }
    location = /privacy/ { rewrite ^ /privacy.php last; }
    location = /contact  { rewrite ^ /contact.php last; }
    location = /contact/ { rewrite ^ /contact.php last; }
    location = /faq      { rewrite ^ /faq.php last; }
    location = /faq/     { rewrite ^ /faq.php last; }
    location = /about    { rewrite ^ /about.php last; }
    location = /about/   { rewrite ^ /about.php last; }
    location = /tutorial { rewrite ^ /tutorial.php last; }
    location = /tutorial/ { rewrite ^ /tutorial.php last; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }
}
