# TrustX Pro — Nginx site
# Copy to: /etc/nginx/sites-available/trustxpro.conf   (Ubuntu)
#      or: /etc/nginx/conf.d/trustxpro.conf           (Amazon Linux)
#
# PHP socket — use the one that exists on the server:
#   Ubuntu:        unix:/run/php/php8.3-fpm.sock
#   Amazon Linux:  unix:/run/php-fpm/www.sock
# Check with:  ls /run/php /run/php-fpm

server {
    listen 80;
    listen [::]:80;
    server_name trustxpro.in www.trustxpro.in;

    root /var/www/main;
    index index.php;

    # Same headers as the old .htaccess (Nginx ignores .htaccess)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Partials are included by PHP; do not serve them as pages
    location ^~ /includes/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    # Legacy .html → current pages
    location = /index.html  { return 301 /; }
    location = /terms.html  { return 301 /terms; }
    location = /privacy.html { return 301 /privacy; }

    # Clean URLs (same as the RewriteRules)
    location = /terms    { rewrite ^ /terms.php last; }
    location = /terms/   { rewrite ^ /terms.php last; }
    location = /privacy  { rewrite ^ /privacy.php last; }
    location = /privacy/ { rewrite ^ /privacy.php last; }
    location = /contact  { rewrite ^ /contact.php last; }
    location = /contact/ { rewrite ^ /contact.php last; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }
}
